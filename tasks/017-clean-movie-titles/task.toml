schema_version = "1.1"

[task]
name = "local/017-clean-movie-titles"
description = "I want to copy the movie titles from the 'Garbage Movie Titles' column to the 'Clean Movie Titles' column. Please remove redundant whitespace and canonicalize letter casing by capitalizing the first letter of each word and leaving the other letters lowercase. Finish the work and don't touch irrelevant regions, even if they are blank."
authors = []
keywords = ["libreoffice-calc", "spreadsheet", "osworld", "compare_table", "movie", "title", "garbage", "clean"]

[metadata]
category = "spreadsheet-editing"
difficulty = "medium"

[verifier]
timeout_sec = 2400.0
user = "agent"

[agent]
timeout_sec = 2400.0
user = "agent"

[environment]
build_timeout_sec = 2400.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
