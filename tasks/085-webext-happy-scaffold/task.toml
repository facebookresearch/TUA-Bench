schema_version = "1.1"

[task]
name = "local/085-webext-happy-scaffold"
description = "Create an unzipped happy-extension v0.0.1 scaffold under /app/happy-extension with a background script and browser action"
authors = []
keywords = ["chrome", "os", "osworld", "multi_apps", "085-webext-happy-scaffold"]

[metadata]
category = "chrome"
difficulty = "medium"

[verifier]
timeout_sec = 2400.0
user = "agent"

