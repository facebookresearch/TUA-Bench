schema_version = "1.1"

[task]
name = "local/040-seattle-ny-miles-flight"
description = "Use Chrome on Delta to find Seattle to New York flights for the 5th of next month and show only Miles fares."
authors = []
keywords = ["chrome", "osworld", "browser", "delta", "flight-search", "miles", "active-tab", "html-parse"]

[metadata]
category = "browser"
difficulty = "medium"

[verifier]
