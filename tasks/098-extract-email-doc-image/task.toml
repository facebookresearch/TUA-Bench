schema_version = "1.1"

[task]
name = "local/098-extract-email-doc-image"
description = "Extract the first image from the DOC attachment in the most recent Notes email and save it as the background artifact"
authors = []
keywords = ["thunderbird", "os", "osworld", "multi_apps", "098-extract-email-doc-image"]

[metadata]
category = "thunderbird"
difficulty = "medium"

[verifier]
timeout_sec = 2400.0
user = "agent"

[agent]
timeout_sec = 2400.0
user = "agent"

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
