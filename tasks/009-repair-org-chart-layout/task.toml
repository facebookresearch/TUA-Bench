schema_version = "1.1"

[task]
name = "local/009-repair-org-chart-layout"
description = "Repair a draw.io corporate organizational chart layout"
authors = []
keywords = ["drawio", "diagramming", "organization-chart", "org-chart", "corporate", "layout-repair"]

[metadata]
category = "diagramming"
difficulty = "medium"

[verifier]
timeout_sec = 2400.0
user = "agent"

[agent]
timeout_sec = 2400.0
user = "agent"

[environment]
build_timeout_sec = 2400.0
cpus = 6
memory_mb = 8192
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GEMINI_API_BASE = "${GEMINI_API_BASE:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
TUA_BENCH_LLM_PROVIDER = "${TUA_BENCH_LLM_PROVIDER:-gemini}"
TUA_BENCH_MODEL = "${TUA_BENCH_MODEL:-gemini-3-flash-preview}"

[environment.env]

[solution.env]
