[project]
name = "tua-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.0.0",
    "harbor==0.6.3",
    "nibabel>=5.3.2",
    "numpy>=2.1.3",
    "openai==2.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
setup-env = "repo_env.setup_env:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["repo_env"]
